name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tag matches manifest.json version
        run: |
          MANIFEST="v$(jq -r .version custom_components/hockey_tracker/manifest.json)"
          if [ "$MANIFEST" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST"
            exit 1
          fi

      # HACS installs the integration from the tagged source; the release body
      # gets the generated Full Changelog link and the New / Fixes / Notes
      # summary is added afterwards with `gh release edit`
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
